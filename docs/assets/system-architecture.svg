<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">RentWise AI system architecture</title>
  <desc id="desc">Flow from the user through the Next.js experience and FastAPI application to the grounded AI workflow and external data sources.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbf7"/>
      <stop offset="1" stop-color="#fbf8f1"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d7254"/>
      <stop offset="1" stop-color="#125642"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16382b" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#699083"/>
    </marker>
    <style>
      .title{font:700 30px Inter,Segoe UI,sans-serif;fill:#15251e}
      .subtitle{font:400 16px Inter,Segoe UI,sans-serif;fill:#687b72}
      .section{font:700 14px Inter,Segoe UI,sans-serif;letter-spacing:1.8px;fill:#196c52}
      .box-title{font:700 17px Inter,Segoe UI,sans-serif;fill:#172820}
      .box-copy{font:400 13px Inter,Segoe UI,sans-serif;fill:#6b7d74}
      .box-title-light{font:700 17px Inter,Segoe UI,sans-serif;fill:#fff}
      .box-copy-light{font:400 13px Inter,Segoe UI,sans-serif;fill:#d9eee6}
      .step{font:700 14px Inter,Segoe UI,sans-serif;fill:#173229}
      .connector{fill:none;stroke:#699083;stroke-width:2;marker-end:url(#arrow)}
      .connector-dash{fill:none;stroke:#8aa79b;stroke-width:2;stroke-dasharray:6 6;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1400" height="860" rx="28" fill="url(#background)"/>
  <text x="70" y="62" class="title">RentWise AI — System Architecture</text>
  <text x="70" y="92" class="subtitle">Transparent rental discovery powered by normalized data and a verified AI workflow</text>

  <!-- Column backgrounds -->
  <rect x="55" y="130" width="270" height="660" rx="22" fill="#ffffff" stroke="#d9e7df"/>
  <rect x="350" y="130" width="370" height="660" rx="22" fill="#ffffff" stroke="#d9e7df"/>
  <rect x="745" y="130" width="600" height="660" rx="22" fill="#ffffff" stroke="#d9e7df"/>

  <text x="80" y="170" class="section">EXPERIENCE</text>
  <text x="375" y="170" class="section">APPLICATION API</text>
  <text x="770" y="170" class="section">INTELLIGENCE &amp; DATA</text>

  <!-- Experience -->
  <circle cx="190" cy="232" r="42" fill="#e6f4ed" stroke="#b8d8ca"/>
  <circle cx="190" cy="220" r="12" fill="#176b51"/>
  <path d="M165 252c5-17 45-17 50 0" fill="#176b51"/>
  <text x="190" y="300" text-anchor="middle" class="box-title">Rental shopper</text>
  <text x="190" y="322" text-anchor="middle" class="box-copy">Apartments or vehicles</text>

  <rect x="80" y="370" width="220" height="150" rx="16" fill="url(#primary)" filter="url(#shadow)"/>
  <rect x="103" y="395" width="42" height="42" rx="9" fill="#ffffff" fill-opacity=".14"/>
  <path d="M114 425h20M114 416h20M114 407h13" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="160" y="414" class="box-title-light">Next.js frontend</text>
  <text x="103" y="465" class="box-copy-light">Search · filters · map</text>
  <text x="103" y="487" class="box-copy-light">Save · sort · compare</text>

  <rect x="80" y="570" width="220" height="130" rx="16" fill="#f3f7f4" stroke="#d3e1d9"/>
  <text x="103" y="607" class="box-title">Client state</text>
  <text x="103" y="634" class="box-copy">Search preferences</text>
  <text x="103" y="656" class="box-copy">Selected and saved listings</text>
  <text x="103" y="678" class="box-copy">Responsive presentation</text>

  <!-- API -->
  <rect x="375" y="205" width="320" height="105" rx="16" fill="url(#primary)" filter="url(#shadow)"/>
  <text x="402" y="244" class="box-title-light">FastAPI gateway</text>
  <text x="402" y="270" class="box-copy-light">Validated REST routes · JSON responses</text>
  <text x="402" y="290" class="box-copy-light">CORS · health · OpenAPI</text>

  <rect x="375" y="355" width="150" height="125" rx="15" fill="#f3f8f5" stroke="#c8ddd2"/>
  <text x="398" y="392" class="box-title">Search service</text>
  <text x="398" y="420" class="box-copy">Normalize query</text>
  <text x="398" y="443" class="box-copy">Merge providers</text>
  <text x="398" y="466" class="box-copy">Return listings</text>

  <rect x="545" y="355" width="150" height="125" rx="15" fill="#f3f8f5" stroke="#c8ddd2"/>
  <text x="568" y="392" class="box-title">Location</text>
  <text x="568" y="420" class="box-copy">Geocode cities</text>
  <text x="568" y="443" class="box-copy">U.S. filtering</text>
  <text x="568" y="466" class="box-copy">Local fallback</text>

  <rect x="375" y="525" width="320" height="150" rx="16" fill="#f3f8f5" stroke="#c8ddd2"/>
  <text x="402" y="563" class="box-title">AI orchestrator</text>
  <text x="402" y="591" class="box-copy">Runs a bounded workflow with server-owned</text>
  <text x="402" y="613" class="box-copy">session context and an auditable agent trace.</text>
  <rect x="402" y="635" width="266" height="4" rx="2" fill="#b9d5c8"/>

  <!-- AI workflow -->
  <rect x="770" y="205" width="550" height="190" rx="17" fill="#edf7f2" stroke="#bdd9cc"/>
  <text x="795" y="239" class="box-title">Grounded assistant workflow</text>
  <circle cx="824" cy="300" r="24" fill="#fff" stroke="#9dc8b6"/>
  <circle cx="921" cy="300" r="24" fill="#fff" stroke="#9dc8b6"/>
  <circle cx="1018" cy="300" r="24" fill="#fff" stroke="#9dc8b6"/>
  <circle cx="1115" cy="300" r="24" fill="#fff" stroke="#9dc8b6"/>
  <circle cx="1212" cy="300" r="24" fill="#176b51"/>
  <text x="824" y="305" text-anchor="middle" class="step">1</text>
  <text x="921" y="305" text-anchor="middle" class="step">2</text>
  <text x="1018" y="305" text-anchor="middle" class="step">3</text>
  <text x="1115" y="305" text-anchor="middle" class="step">4</text>
  <text x="1212" y="305" text-anchor="middle" style="font:700 14px Inter,Segoe UI,sans-serif;fill:#fff">5</text>
  <path d="M848 300h48M945 300h48M1042 300h48M1139 300h48" class="connector"/>
  <text x="824" y="347" text-anchor="middle" class="box-copy">Intent</text>
  <text x="921" y="347" text-anchor="middle" class="box-copy">Search</text>
  <text x="1018" y="347" text-anchor="middle" class="box-copy">Rank</text>
  <text x="1115" y="347" text-anchor="middle" class="box-copy">Respond</text>
  <text x="1212" y="347" text-anchor="middle" class="box-copy">Verify</text>
  <text x="1045" y="374" text-anchor="middle" class="box-copy">Every answer is checked against retrieved listing data</text>

  <!-- Data sources -->
  <rect x="770" y="445" width="255" height="120" rx="15" fill="#f8f8f4" stroke="#dedfd5"/>
  <text x="794" y="482" class="box-title">Rental inventory</text>
  <text x="794" y="510" class="box-copy">Provider adapter interface</text>
  <text x="794" y="533" class="box-copy">Mock + public fallback feed</text>

  <rect x="1045" y="445" width="275" height="120" rx="15" fill="#f8f8f4" stroke="#dedfd5"/>
  <text x="1069" y="482" class="box-title">Location intelligence</text>
  <text x="1069" y="510" class="box-copy">OpenStreetMap Nominatim</text>
  <text x="1069" y="533" class="box-copy">Built-in city and state fallback</text>

  <rect x="770" y="605" width="550" height="100" rx="15" fill="#f8f8f4" stroke="#dedfd5"/>
  <text x="794" y="642" class="box-title">Local market knowledge</text>
  <text x="794" y="670" class="box-copy">Vector retrieval supplies grounded city context for market questions</text>

  <!-- Main connections -->
  <path d="M190 274v90" class="connector"/>
  <path d="M300 445h67" class="connector"/>
  <text x="333" y="432" text-anchor="middle" class="box-copy">REST</text>
  <path d="M535 310v38" class="connector"/>
  <path d="M525 417h13" class="connector"/>
  <path d="M535 480v38" class="connector"/>
  <path d="M695 570h18c32 0 22-240 49-240" class="connector"/>
  <path d="M525 417c120 0 130 88 237 88" class="connector-dash"/>
  <path d="M620 417c100 0 184 88 417 88" class="connector-dash"/>
  <path d="M1045 605v-32" class="connector-dash"/>
  <path d="M770 655h-67c-22 0-35-16-35-35" class="connector-dash"/>

  <text x="70" y="827" class="subtitle">Solid lines: primary request flow  ·  Dashed lines: supporting data and retrieval paths</text>
</svg>
